name: Publish to PyPI

# 合并到 master 后自动运行：
#   1. 读取 pyproject.toml 中的 version
#   2. 校验版本格式（只允许 0.0.4 或 0.0.4.post1 两种）
#   3. 若对应 tag 不存在，则自动打 tag 并推送
#   4. 构建并发布到 PyPI
on:
  push:
    branches:
      - master

# 允许 workflow 创建 tag（写入仓库内容），并申请 OIDC token 用于 PyPI 可信发布。
# 注意：一旦显式声明 permissions，未列出的权限都会被置为 none，
# 因此这里必须同时列出 id-token: write，否则 Trusted Publishing 会失败。
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # 使用 PyPI Trusted Publishing（OIDC），无需在仓库配置 API token
    environment: pypi
    concurrency:
      group: publish-pypi
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        run: |
          set -euo pipefail

          # 从 pyproject.toml 的 [project] 段提取 version（取第一行匹配）
          RAW_VERSION="$(grep -E '^[[:space:]]*version[[:space:]]*=' pyproject.toml | head -n1 | sed -E 's/.*=[[:space:]]*["'"'"']([^"'"'"']+)["'"'"'].*/\1/')"
          echo "Raw version from pyproject.toml: '${RAW_VERSION}'"

          if [ -z "${RAW_VERSION}" ]; then
            echo "::error::无法从 pyproject.toml 中解析 version"
            exit 1
          fi

          # 版本格式校验：只允许两种
          #   1) 纯版本号：      X.Y.Z            例如 0.0.4
          #   2) post release：  X.Y.Z.postN      例如 0.0.4.post1
          if [[ ! "${RAW_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            echo "::error::版本格式非法: '${RAW_VERSION}'。只允许 '0.0.4' 或 '0.0.4.post1' 两种格式。"
            exit 1
          fi

          # tag 名沿用仓库既有约定：直接使用版本号本身（无 v 前缀）。
          # .postN 是合法的 PEP 440 版本，PyPI 直接接受，无需任何改写，
          # 因此 tag、GitHub Release、PyPI 三处版本号完全一致。
          TAG_NAME="${RAW_VERSION}"

          echo "raw_version=${RAW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}"       >> "$GITHUB_OUTPUT"

          echo "校验通过：version='${RAW_VERSION}'"

      - name: Check tag existence
        id: tagcheck
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag '${TAG_NAME}' 已存在，跳过后续打 tag 与发布。"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '${TAG_NAME}' 不存在，将创建并发布。"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.version.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin "refs/tags/${TAG_NAME}"

      - name: Set up Python
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Build package
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build

          rm -rf ./dist
          python -m build

          python -m pip install --upgrade twine
          twine check dist/*

      - name: Publish to PyPI
        if: steps.tagcheck.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Generate release notes from merged PRs
        if: steps.tagcheck.outputs.exists == 'false'
        id: notes
        env:
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
        run: |
          set -euo pipefail
          # 汇总「上一个 tag 之后」合并进主线的所有 MR/PR，作为本次发布说明。
          # 这里的 PR 都以标准 merge commit（"Merge pull request #NN ..."）方式合入，
          # 因此可以从 merge commit 的 subject 取 PR 编号、从 body 首行取 PR 标题。

          # 找出上一个版本 tag：在当前 HEAD 的祖先里，按版本号降序排除本次 tag 后的第一个。
          PREV_TAG="$(git tag --sort=-v:refname --merged HEAD | grep -v -x "${TAG_NAME}" | head -n1 || true)"
          if [ -n "${PREV_TAG}" ]; then
            echo "上一个 tag: ${PREV_TAG}"
            RANGE="${PREV_TAG}..HEAD"
          else
            echo "未找到上一个 tag，纳入全部历史。"
            RANGE="HEAD"
          fi

          NOTES_FILE="release_notes.md"
          {
            echo "## What's Changed"
            echo
            git log --merges --first-parent --pretty=format:'%H' "${RANGE}" | while IFS= read -r sha; do
              [ -z "${sha}" ] && continue
              subject="$(git show -s --format='%s' "${sha}")"
              pr_num="$(printf '%s' "${subject}" | sed -nE 's/^Merge pull request #([0-9]+).*/\1/p')"
              # 只收录能识别出 PR 编号的 merge commit（跳过普通的分支合并）。
              [ -z "${pr_num}" ] && continue
              title="$(git show -s --format='%b' "${sha}" | sed -e '/^[[:space:]]*$/d' | head -n1)"
              [ -z "${title}" ] && title="${subject}"
              printf -- '- %s (#%s)\n' "${title}" "${pr_num}"
            done
          } > "${NOTES_FILE}"

          # 兜底：若区间内没有任何可识别的 PR，避免生成空说明。
          if [ "$(wc -l < "${NOTES_FILE}")" -le 2 ]; then
            printf 'Automated release for %s\n' "${TAG_NAME}" > "${NOTES_FILE}"
          fi

          echo "----- release notes -----"
          cat "${NOTES_FILE}"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release with build artifacts
        if: steps.tagcheck.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          # 在对应 tag 上创建 GitHub Release，并把构建产物（.whl 与 sdist .tar.gz）
          # 作为可下载附件上传。GitHub 会额外自动附带 Source code (zip/tar.gz)。
          # 发布说明来自上一步汇总的 MR/PR 列表。
          gh release create "${TAG_NAME}" dist/* \
            --title "${TAG_NAME}" \
            --notes-file "${NOTES_FILE}"
